name: roam_agent
description: Flutter multilingual AI travel concierge for mock intercity bus journeys.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  collection: ^1.18.0
  flutter_map: ^7.0.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  latlong2: ^0.9.1
  provider: ^6.1.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
